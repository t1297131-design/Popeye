    <div class="number-area"><span class="sr-only">Order number </span><span id="order-number"><!--ORDER_NUMBER-->5876<!--/ORDER_NUMBER--></span></div>

  <script>
    (() => {
      const number = document.getElementById('order-number');
      const area = number.parentElement;

      // Read: ?order=1234
      const params = new URLSearchParams(window.location.search);
      const orderNumber = params.get('order');

      if (orderNumber && orderNumber.trim() !== '') {
        number.textContent = orderNumber.trim();
      }

      function fitNumber() {
        // 5876 is already part of the original image,
        // so don't draw another copy on top of it.
        area.classList.toggle(
                'original',
                number.textContent.trim() === '5876'
        );

        number.style.transform = 'none';

        const available =
                area.clientWidth -
                parseFloat(getComputedStyle(area).paddingLeft) * 2;

        if (number.scrollWidth > available && available > 0) {
          number.style.transform =
                  `scaleX(${available / number.scrollWidth})`;
        }
      }

      new ResizeObserver(fitNumber).observe(area);

      new MutationObserver(fitNumber).observe(number, {
        childList: true,
        characterData: true,
        subtree: true
      });

      fitNumber();
    })();
  </script>
